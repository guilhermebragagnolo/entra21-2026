<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Cadastro</title>

<style>
body {
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    font-family: Arial, sans-serif;
    padding: 20px;
}

.container {
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0px 10px 30px rgba(0,0,0,0.3);
}

h2 {
    text-align: center;
    margin-bottom: 20px;
    color: #333;
}

input {
    width: 95%;
    padding: 12px;
    margin: 8px 0;
    border: 1px solid #ccc;
    border-radius: 8px;
    outline: none;
    transition: 0.3s;
}

input:focus {
    border-color: #2a5298;
    box-shadow: 0 0 8px rgba(42,82,152,0.5);
}

.botoes {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
}

.cadastrar {
    background: #28a745;
    color: white;
}

.ver {
    background: #2a5298;
    color: white;
}

button:hover {
    transform: scale(1.05);
    opacity: 0.9;
}

.cadastrar { background: #28a745; color: white; }
.ver { background: #2a5298; color: white; }
</style>
</head>

<body>

<div class="container">
    <h2>Cadastro</h2>

    <input type="text" id="nome" placeholder="Nome">
    <input type="email" id="email" placeholder="Email">
    <input type="text" id="telefone" placeholder="Telefone">
    <input type="text" id="cpf" placeholder="CPF">

    <input type="text" id="cep" placeholder="CEP">

    <input type="text" id="rua" placeholder="Rua">
    <input type="text" id="bairro" placeholder="Bairro">
    <input type="text" id="cidade" placeholder="Cidade">
    <input type="text" id="estado" placeholder="Estado">

    <button class="cadastrar" onclick="cadastrar()">Cadastrar</button>

    <button class="ver" onclick="irParaClientes()">Ver Clientes</button>
</div>

</script>
    <script src="cadastro.js"></script>
<script>
function irParaClientes() {
    window.location.href = "clientes.html";
}
</script>

</body>
</html>
