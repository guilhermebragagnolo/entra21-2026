<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Clientes</title>

<style>
body {
    background: #f4f4f4;
    font-family: Arial;
    padding: 20px;
}

h2 {
    text-align: center;
}

.container-cards {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    justify-content: flex-start;
}

.card {
    background: white;
    padding: 15px;
    border-radius: 10px;
    width: 400px;
    box-shadow: 0px 5px 15px rgba(0,0,0,0.2);
    transition: 0.3s;
}

.card:hover {
    transform: scale(1.05);
}

.card h3 {
    margin: 0 0 10px 0;
}

.card p {
    margin: 5px 0;
}

.card button {
    margin-top: 10px;
    margin-right: 5px;
    padding: 5px 10px;
    border: none;
    cursor: pointer;
}

.edit {
    background: orange;
}

.delete {
    background: red;
    color: white;
}

button {
    padding: 5px 10px;
    margin: 2px;
    border: none;
    cursor: pointer;
}

#busca {
    display: block;
    width: 400px;
    margin: 20px auto;
    padding: 10px;
    box-shadow: 0px 5px 5px rgba(0,0,0,0.2);
    border-radius: 10px;
}

#placeholder {
    text-align: center;
    color: #000000;
    font-family: arial;
}

.edit { background: orange; }
.delete { background: red; color: white; }
.voltar { background: #2a5298; color: white; margin-bottom: 15px; }
</style>
</head>

<h2>Clientes Cadastrados</h2>

<input type="text" id="busca" placeholder="Buscar por nome..." onkeyup="filtrar()">

<div id="lista" class="container-cards"></div>

<script src="clientes.js"></script>

</body>
</html>
